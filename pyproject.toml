[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-phase-estimation-shor"
version = "2.0.0"
description = "Quantum Phase Estimation (QPE) Eigenvalue Extraction Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1", "pydantic>=2,<3"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
quantum-phase-estimation-shor = "qpe_engine.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/quantum-phase-estimation-shor"
Repository = "https://github.com/abusuraihsakhri/quantum-phase-estimation-shor.git"

[tool.setuptools.packages.find]
include = ["agents*", "qpe_engine*"]
