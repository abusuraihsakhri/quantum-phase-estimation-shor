version: '3.8'

services:
  quantum-phase-estimation-shor:
    build: .
    container_name: quantum-phase-estimation-shor
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=quantum-phase-estimation-shor-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
